name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: native
        # npm ci: package-lock.json'a HARFİ HARFİNE uyar.
        # `npm install` kilidi yok sayıp bağımlılıkları yükseltebiliyordu —
        # Hermes'i kıran supabase-js 2.106 sürümü tam olarak böyle gelmişti.
        run: npm ci

      - name: Type check
        working-directory: native
        run: npx tsc --noEmit

      - name: Lint
        working-directory: native
        run: npx eslint .

      - name: Tests
        working-directory: native
        run: npx jest --ci

      - name: Bağımlılık güvenlik taraması
        working-directory: native
        # Bilgilendirici: mevcut yüksek seviyeli bulguların HEPSİ Expo'nun
        # derleme zincirinden geliyor (metro, postcss, shell-quote) ve
        # APK'ya girmiyor. `npm audit fix --force` Expo SDK'yı yükseltir;
        # bu ayrı ve riskli bir iştir, derlemeyi kırmasın diye bloklamıyor.
        continue-on-error: true
        run: npm audit --omit=dev

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS auth
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (Android)
        id: eas_build
        working-directory: native
        # --json derleme bitince çıktıyı makine okunur verir; içinde
        # imzalanmış dosyanın indirme adresi var. --wait olmadan komut
        # kuyruğa atıp dönüyordu ve indirecek bir şey olmuyordu.
        run: |
          # `|| true`: eas hata verdiğinde adım o satırda kesilirse aşağıdaki
          # teşhis çıktısı hiç basılmıyor. Çıkışı kendimiz değerlendiriyoruz.
          eas build --platform android --profile ${{ inputs.profile }} \
            --non-interactive --wait --json > eas-build.json || true

          echo "::group::EAS çıktısı"
          jq '.' eas-build.json 2>/dev/null || cat eas-build.json
          echo "::endgroup::"

          # --json tek derlemede bile dizi döndürüyor.
          # `|| true`: çıktı hiç JSON değilse jq'nun ayrıştırma hatası yerine
          # aşağıdaki anlaşılır mesaj görünsün.
          SONUC=$(jq -r 'if type=="array" then .[0] else . end' eas-build.json 2>/dev/null || true)
          INDIRME=$(echo "$SONUC" | jq -r '.artifacts.applicationArchiveUrl // empty' 2>/dev/null || true)
          SAYFA=$(echo   "$SONUC" | jq -r '.id // empty'     2>/dev/null || true)
          DURUM=$(echo   "$SONUC" | jq -r '.status // empty' 2>/dev/null || true)

          # eas yalnızca ERRORED durumunda sıfırdan farklı çıkıyor; İPTAL
          # EDİLEN derlemede 0 dönüyor ve indirecek dosya olmuyor. Bu yüzden
          # çıkış koduna değil, durumun kendisine bakıyoruz.
          if [ "$DURUM" != "FINISHED" ] || [ -z "$INDIRME" ]; then
            echo "❌ Derleme tamamlanmadı — durum: ${DURUM:-(okunamadı)}"
            echo "   İndirme adresi: ${INDIRME:-yok}"
            echo "   Ayrıntı için aşağıdaki 'Fetch failure logs' adımına bakın."
            exit 1
          fi

          echo "indirme=$INDIRME" >> "$GITHUB_OUTPUT"
          echo "sayfa=https://expo.dev/accounts/_/projects/_/builds/$SAYFA" >> "$GITHUB_OUTPUT"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"

      # EAS dosyayı kendi sunucusunda tutuyor; buraya indirilmezse
      # Actions sayfasında görülecek bir şey olmuyordu.
      - name: Dosyayı indir
        id: indir
        working-directory: native
        run: |
          URL="${{ steps.eas_build.outputs.indirme }}"
          case "$URL" in
            *.aab) AD="genctetsiad-${{ inputs.profile }}.aab" ;;
            *)     AD="genctetsiad-${{ inputs.profile }}.apk" ;;
          esac
          curl -fsSL "$URL" -o "$AD"
          echo "ad=$AD" >> "$GITHUB_OUTPUT"
          echo "boyut=$(du -h "$AD" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$AD" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Actions'a yükle
        uses: actions/upload-artifact@v4
        with:
          name: genctetsiad-${{ inputs.profile }}
          path: native/${{ steps.indir.outputs.ad }}
          retention-days: 30
          if-no-files-found: error

      - name: Özet
        run: |
          {
            echo "## 📦 ${{ steps.indir.outputs.ad }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Profil | \`${{ inputs.profile }}\` |"
            echo "| Boyut | ${{ steps.indir.outputs.boyut }} |"
            echo "| SHA-256 | \`${{ steps.indir.outputs.sha }}\` |"
            echo
            echo "**Bu sayfanın en altındaki _Artifacts_ bölümünden indirilir.**"
            echo "Bağlantı 30 gün geçerlidir ve indirmek için GitHub'da oturum açmak gerekir."
            echo
            if [ "${{ inputs.profile }}" = "production" ]; then
              echo "> \`production\` profili **.aab** üretir — Play Console'a yüklemek içindir,"
              echo "> telefona doğrudan kurulamaz. Teste \`preview\` profilini kullanın."
            else
              echo "### Telefona kurulum"
              echo "1. Dosyayı Android telefona aktarın"
              echo "2. Ayarlar → *Bilinmeyen kaynaklara izin ver* (dosya yöneticisi için)"
              echo "3. APK'ya dokunup kurun"
            fi
            echo
            echo "EAS derleme sayfası: ${{ steps.eas_build.outputs.sayfa }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🔴 Fetch failure logs
        if: failure()
        working-directory: native
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          echo "=================================================="
          echo "📋 FETCHING ACTUAL BUILD ERROR FROM EAS API"
          echo "=================================================="

          BUILD_INFO=$(eas build:list --limit 1 --json --non-interactive 2>&1)
          BUILD_ID=$(echo "$BUILD_INFO" | jq -r '.[0].id // empty' 2>/dev/null)
          echo "🔍 Build ID: $BUILD_ID"

          if [ -z "$BUILD_ID" ]; then
            echo "❌ BUILD_INFO: $BUILD_INFO"
            exit 0
          fi

          # logFiles URL'lerini BUILD_INFO'dan hemen al (URL'ler kısa süre geçerli)
          LOG_URL=$(echo "$BUILD_INFO" | jq -r '.[0].logFiles[0] // empty' 2>/dev/null)

          echo "::group::❌ EAS Error"
          echo "$BUILD_INFO" | jq -r '.[0].error' 2>/dev/null
          echo "::endgroup::"

          if [ -n "$LOG_URL" ]; then
            echo "📥 Downloading log: $LOG_URL"
            curl -fsSL "$LOG_URL" -o build.log.txt 2>&1
            if [ -f build.log.txt ] && [ -s build.log.txt ]; then
              echo "✅ Log downloaded: $(wc -c < build.log.txt) bytes"
              echo "::group::🔥 FULL BUILD LOG"
              cat build.log.txt
              echo "::endgroup::"
              echo "::group::🎯 GRADLE ERRORS ONLY"
              grep -E "^(FAILURE|e:|error:|ERROR|> Task|BUILD FAILED|Exception|Caused by)" build.log.txt || echo "(no grep match)"
              echo "::endgroup::"
            else
              echo "❌ Log download failed"
            fi
          else
            echo "❌ No logFiles URL in BUILD_INFO"
            echo "BUILD_INFO: $BUILD_INFO"
          fi
